<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TallyPay — Sign in</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><span class="brand">TallyPay Overtime</span><span>Training sandbox</span></header>
<main>
  <h1>Sign in</h1>
  <form class="card" id="login">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username">
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button type="submit">Sign in</button></div>
    <div id="error" role="alert"></div>
  </form>
</main>
<script src="/app.js"></script>
<script>
document.getElementById('login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  document.getElementById('error').textContent = '';
  const r = await TP.api('POST', '/api/auth/login', { username: username.value.trim(), password: password.value });
  if (r.status !== 200) { document.getElementById('error').textContent = (r.data && r.data.error) || 'Sign in failed'; return; }
  sessionStorage.setItem('tp_token', r.data.token);
  sessionStorage.setItem('tp_me', JSON.stringify(r.data));
  location.href = '/claims.html';
});
</script>
</body></html>
